version: '3'

set:
  - errexit
  - nounset
  - pipefail

shopt:
  - globstar

silent: true

vars:
  dc: 'docker compose'
  composer: '{{.dc}} run --rm php composer'
  php: '{{.dc}} run --rm php php'

tasks:
  ci:
    cmds:
      - task: check-style
      - task: static
      - task: test
      - defer:
          task: clean
    deps:
      - install

  check-style:
    cmd: '{{.php}} vendor/bin/php-cs-fixer fix --dry-run --diff --verbose 2>/dev/null'
    deps:
      - install
    sources:
      - .php-cs-fixer.php
      - .php-cs-fixer.dist.php
      - src/**/*.php
      - tests/**/*.php

  clean:
    cmd: '{{.dc}} down -t0 -v 2>/dev/null'

  coverage:
    cmd: '{{.php}} vendor/bin/phpunit --coverage-html=coverage/ 2>/dev/null'
    deps:
      - install
    env:
      XDEBUG_MODE: coverage
    generates:
      - coverage/**/*
    sources:
      - phpunit.xml
      - phpunit.xml.dist
      - src/**/*.php
      - tests/**/*.php

  fix-style:
    cmd: '{{.php}} vendor/bin/php-cs-fixer fix 2>/dev/null'
    deps:
      - install
    sources:
      - .php-cs-fixer.php
      - .php-cs-fixer.dist.php
      - src/**/*.php
      - tests/**/*.php

  install:
    cmd: '{{.composer}} update --prefer-{{ .DEPENDENCY_VERSIONS | default "stable" }} --prefer-stable 2>/dev/null'
    aliases:
      - composer
    deps:
      - validate
    generates:
      - composer.lock
      - vendor/**/*
    sources:
      - composer.json

  shell:
    cmd: '{{.dc}} run --rm php bash 2>/dev/null'
    interactive: true

  static:
    cmd: '{{.php}} vendor/bin/phpstan 2>/dev/null'
    aliases:
      - phpstan
    deps:
      - install
    sources:
      - phpstan.neon
      - phpstan.neon.dist
      - src/**/*.php
      - tests/**/*.php

  test:
    cmds:
      - '{{.php}} vendor/bin/phpunit 2>/dev/null'
      - task: clean
    aliases:
      - tests
    deps:
      - install
    sources:
      - phpunit.xml
      - phpunit.xml.dist
      - src/**/*.php
      - tests/**/*.php

  update:
    cmd: '{{.composer}} update --prefer-stable 2>/dev/null'
    aliases:
      - upgrade
    deps:
      - validate

  validate:
    cmd: '{{.composer}} validate 2>/dev/null'
    sources:
      - composer.json
