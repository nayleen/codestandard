name: ci

on:
  pull_request:
    branches:
      - latest
  push:
    branches:
      - latest

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - 8.3
          - 8.4
        dependencies:
          - stable
          - lowest
    env:
      PHP_VERSION: ${{ matrix.php }}
      DEPENDENCY_VERSIONS: ${{ matrix.dependencies }}
    steps:
      - uses: actions/checkout@v5
      - uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: docker compose pull --quiet
      - run: task ci
